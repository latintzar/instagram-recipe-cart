[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-recipe-cart"
version = "0.1.0"
description = "Turn Instagram recipe reels into local grocery carts"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "yt-dlp>=2024.1", "mcp==1.26.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
instagram-recipe-cart-worker = "social_cart.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
